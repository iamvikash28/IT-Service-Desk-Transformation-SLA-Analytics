{% extends "base.html" %}{% block content %}<section class="hero"><div><p class="eyebrow">TICKET INTAKE</p><h1>Create a ticket</h1><p class="muted">Use synthetic/demo information only.</p></div></section>
<section class="panel form-panel"><form method="post" action="{{ url_for('main.create_ticket') }}"><label>Title<input name="title" maxlength="200" required></label>
<label>Description<textarea name="description" rows="5" required></textarea></label><div class="two-col">
<label>Category<select name="category">{% for x in categories %}<option>{{ x.category_name }}</option>{% endfor %}</select></label>
<label>Priority<select name="priority">{% for x in priorities %}<option>{{ x.priority_name }}</option>{% endfor %}</select></label>
<label>Department<select name="department">{% for x in departments %}<option>{{ x.department_name }}</option>{% endfor %}</select></label>
<label>Assigned team<select name="assigned_team">{% for x in teams %}<option>{{ x.team_name }}</option>{% endfor %}</select></label></div><button>Create ticket</button> <a class="text-link" href="{{ url_for('main.index') }}">Cancel</a></form></section>{% endblock %}
